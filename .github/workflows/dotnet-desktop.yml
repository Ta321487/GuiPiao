name: .NET Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Desktop_Project: GuiPiao.csproj
      Test_Project: GuiPiao.Tests/GuiPiao.Tests.csproj

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      # 不编 GuiPiao.Mobile（net10 MAUI，需单独流水线与 workload）
      run: |
        dotnet restore ${{ env.Desktop_Project }}
        dotnet restore ${{ env.Test_Project }}

    - name: Build desktop
      run: dotnet build ${{ env.Desktop_Project }} --configuration Release --no-restore

    - name: Build tests
      run: dotnet build ${{ env.Test_Project }} --configuration Release --no-restore

    - name: Run tests
      # 排除依赖本机 DB/端口的 TCP 烟测；其余单测在 CI 跑
      run: >
        dotnet test ${{ env.Test_Project }}
        --configuration Release
        --no-build
        --filter "FullyQualifiedName!~SyncHttpServerTcp"

    - name: Publish the application
      run: dotnet publish ${{ env.Desktop_Project }} --configuration Release --no-build --output publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: GuiPiao-release
        path: publish
